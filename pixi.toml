[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.11"
pip = ">=25"

[pypi-dependencies]
waterology-research = { path = ".", editable = true, extras = ["dashboard", "mcp"] }

[feature.dev.dependencies]
python-build = ">=1.3"
pytest = ">=8.4"
pytest-cov = ">=6.2"
ruff = ">=0.12"
hatchling = ">=1.27"

[feature.dev.pypi-dependencies]
httpx = ">=0.28,<1"

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
check = { depends-on = ["lint", "test"] }
