# decision applies in strict mode; light is the light mode decision.
cases:
  - id: clean-documentation
    situation: One writer, clean checkout, documentation only, no behavior change.
    decision: work-in-place
    light: work-in-place
  - id: dirty-checkout
    situation: The checkout contains unrelated changes.
    decision: create
    light: create
  - id: concurrent-writer
    situation: Another session may write to the repository.
    decision: create
    light: create
  - id: behavioral-edit
    situation: The task changes a skill, agent instruction, hook, or runtime behavior.
    decision: create
    light: branch-in-place
  - id: related-multi-file-change
    situation: The task spans several related files or needs an isolated test cycle.
    decision: create
    light: branch-in-place
  - id: already-isolated
    situation: The session is already inside a linked worktree.
    decision: reuse
    light: reuse
